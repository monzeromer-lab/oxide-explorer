[package]
name = "oxide-explorer"
version = "0.4.0"
edition = "2024"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_4"] }
gio = "0.20"
glib = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "sync", "macros"] }
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
once_cell = "1"
nix = { version = "0.29", features = ["fs", "user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
vte4 = { version = "0.8", optional = true }
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize"] }

[features]
default = ["terminal"]
terminal = ["vte4"]
