[package]
name = "oxide-explorer"
version = "0.1.0"
edition = "2024"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_4"] }
gio = "0.20"
glib = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "sync", "macros"] }
trash = "5"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
once_cell = "1"
